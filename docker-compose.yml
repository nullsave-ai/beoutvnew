# قاعدة بيانات وRedis للتطوير فقط
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: beout, POSTGRES_PASSWORD: beout, POSTGRES_DB: beout }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
